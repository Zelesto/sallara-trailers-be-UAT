services:
  - type: web
    name: sallara-trailers-be-uat
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: APP_DB_INIT_ENABLED
        value: "false"
      - key: APP_DB_INIT_SEED
        value: "false"
      - key: APP_DB_INIT_DROP
        value: "false"
      - key: OPENROUTESERVICE_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRATION
        value: "86400000"
    healthCheckPath: /actuator/health
    autoDeploy: true
